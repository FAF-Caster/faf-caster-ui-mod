name: FAF UI Mod Package

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faf-caster-release-main
  cancel-in-progress: false

jobs:
  package-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate FAF UI mod metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f mod_info.lua
          grep -Eq 'ui_only[[:space:]]*=[[:space:]]*true' mod_info.lua
          grep -Eq 'uid[[:space:]]*=' mod_info.lua
          grep -Eq 'name[[:space:]]*=' mod_info.lua
          grep -Eq 'version[[:space:]]*=[[:space:]]*[0-9]+' mod_info.lua
          if grep -Eq 'FAF Caster Test|FAF-CASTER-TEST-001' mod_info.lua; then
            echo 'Release blocked: replace test mod name and UID before tagging.' >&2
            exit 1
          fi
      - name: Create Mod Vault ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/FAF-Caster-UI-Mod dist
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|.gitignore|README*|LICENSE*|docs/*|staging/*|dist/*) continue ;;
            esac
            mkdir -p "staging/FAF-Caster-UI-Mod/$(dirname "$file")"
            cp "$file" "staging/FAF-Caster-UI-Mod/$file"
          done
          test -f staging/FAF-Caster-UI-Mod/mod_info.lua
          (cd staging && zip -qr ../dist/FAF-Caster-UI-Mod.zip FAF-Caster-UI-Mod)
          unzip -l dist/FAF-Caster-UI-Mod.zip
          unzip -t dist/FAF-Caster-UI-Mod.zip
          test "$(unzip -Z1 dist/FAF-Caster-UI-Mod.zip | grep -c '^FAF-Caster-UI-Mod/mod_info.lua$')" -eq 1
          test "$(unzip -Z1 dist/FAF-Caster-UI-Mod.zip | grep -c '^FAF-Caster-UI-Mod/icon.png$')" -eq 1
      - name: Upload Mod Vault candidate
        uses: actions/upload-artifact@v4
        with:
          name: FAF-Caster-UI-Mod
          path: dist/FAF-Caster-UI-Mod.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-mod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: FAF-Caster-UI-Mod
      - name: Determine next stable version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo "Main moved since this build; newer push will release." >&2; exit 1; }
          PREFIX="v$(date -u +%y.%m)."
          LAST=-1
          while IFS= read -r tag; do
            suffix="${tag#"$PREFIX"}"
            if [[ "$suffix" =~ ^[0-9]+$ ]] && (( 10#$suffix > LAST )); then
              LAST=$((10#$suffix))
            fi
          done < <(git tag --list "${PREFIX}*")
          NEXT=$((LAST + 1))
          TAG="${PREFIX}${NEXT}"
          if gh release view "$TAG" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Refusing to overwrite existing release $TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NUMBER=$(( $(git tag --list 'v[0-9][0-9].[0-9][0-9].[0-9]*' | wc -l) + 1 ))" >> "$GITHUB_ENV"
      - name: Update numeric FAF mod version in release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked
          unzip -q FAF-Caster-UI-Mod.zip -d unpacked
          sed -i -E "s/^version[[:space:]]*=[[:space:]]*[0-9]+/version = ${RELEASE_NUMBER}/" unpacked/FAF-Caster-UI-Mod/mod_info.lua
          grep -qx "version = ${RELEASE_NUMBER}" unpacked/FAF-Caster-UI-Mod/mod_info.lua
          (cd unpacked && zip -qr "../FAF-Caster-Bridge-${RELEASE_TAG}.zip" FAF-Caster-UI-Mod)
          unzip -t "FAF-Caster-Bridge-${RELEASE_TAG}.zip"
      - name: Generate changelog and installation notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/releases/generate-notes" -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" --jq '.body' > generated-changelog.md
          {
            echo "## Installation"
            echo
            echo '1. Download the attached `FAF-Caster-Bridge-'"$RELEASE_TAG"'.zip`.'
            echo '2. Extract the `FAF-Caster-UI-Mod` folder into your FAF UI mods directory.'
            echo "3. Enable **FAF Caster Bridge** in FAF's UI mod selection."
            echo "4. Run the matching [FAF Caster Desktop](https://github.com/FAF-Caster/FAF-Caster/releases) application."
            echo
            echo "FAF mod internal version: ${RELEASE_NUMBER}."
            echo "This GitHub release does not automatically publish the mod to the FAF Mod Vault."
            echo
            echo "## Changes"
            echo
            cat generated-changelog.md
          } > release-notes.md
      - name: Create tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]] || { echo "Main advanced; refusing stale release." >&2; exit 1; }
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$GITHUB_SHA" >/dev/null
          gh release create "$RELEASE_TAG" "FAF-Caster-Bridge-${RELEASE_TAG}.zip" --verify-tag --title "FAF Caster Bridge $RELEASE_TAG" --notes-file release-notes.md
