name: FAF UI Mod Package

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (YY.MM.N), leave empty to only build'
        required: false
        type: string

permissions:
  contents: read

jobs:
  package-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate stable release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo 'Expected tag vYY.MM.N' >&2; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release tags must point to main.' >&2; exit 1; }
      - name: Validate FAF UI mod metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f mod_info.lua
          grep -Eq 'ui_only[[:space:]]*=[[:space:]]*true' mod_info.lua
          grep -Eq 'uid[[:space:]]*=' mod_info.lua
          grep -Eq 'name[[:space:]]*=' mod_info.lua
          grep -Eq 'version[[:space:]]*=[[:space:]]*[0-9]+' mod_info.lua
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && grep -Eq 'FAF Caster Test|FAF-CASTER-TEST-001' mod_info.lua; then
            echo 'Release blocked: replace test mod name and UID before tagging.' >&2
            exit 1
          fi
      - name: Create Mod Vault ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/FAF-Caster-UI-Mod dist
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|.gitignore|README*|LICENSE*|docs/*|staging/*|dist/*) continue ;;
            esac
            mkdir -p "staging/FAF-Caster-UI-Mod/$(dirname "$file")"
            cp "$file" "staging/FAF-Caster-UI-Mod/$file"
          done
          test -f staging/FAF-Caster-UI-Mod/mod_info.lua
          (cd staging && zip -qr ../dist/FAF-Caster-UI-Mod.zip FAF-Caster-UI-Mod)
          unzip -l dist/FAF-Caster-UI-Mod.zip
          unzip -t dist/FAF-Caster-UI-Mod.zip
          test "$(unzip -Z1 dist/FAF-Caster-UI-Mod.zip | grep -c '^FAF-Caster-UI-Mod/mod_info.lua$')" -eq 1
          test "$(unzip -Z1 dist/FAF-Caster-UI-Mod.zip | grep -c '^FAF-Caster-UI-Mod/icon.png$')" -eq 1
      - name: Upload Mod Vault candidate
        uses: actions/upload-artifact@v4
        with:
          name: FAF-Caster-UI-Mod
          path: dist/FAF-Caster-UI-Mod.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main')
    needs: package-mod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: FAF-Caster-UI-Mod
      - name: Validate release version and create tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${REF_NAME}"
          else
            [[ "${GITHUB_REF}" == refs/heads/main ]] || { echo 'Run release workflow on main only.' >&2; exit 1; }
            TAG="v${INPUT_VERSION}"
          fi
          [[ "$TAG" =~ ^v[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "Invalid release version: $TAG" >&2; exit 1; }
          git fetch origin main
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo 'Tag must point to main.' >&2; exit 1; }
          else
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo 'Main changed during build; rerun release.' >&2; exit 1; }
            if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists; refusing to overwrite." >&2
              exit 1
            fi
            gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Create versioned package and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          mv FAF-Caster-UI-Mod.zip "FAF-Caster-Bridge-${TAG}.zip"
          gh api "repos/${GH_REPO}/releases/generate-notes" -f tag_name="$TAG" -f target_commitish=main --jq '.body' > generated-changelog.md
          {
            echo "## Installation"
            echo
            echo '1. Download the attached `FAF-Caster-Bridge-'"${TAG}"'.zip`.'
            echo '2. Extract the `FAF-Caster-UI-Mod` folder into your FAF UI mods directory.'
            echo "3. Enable **FAF Caster Bridge** in FAF's UI mod selection."
            echo "4. Run the matching [FAF Caster Desktop](https://github.com/FAF-Caster/FAF-Caster/releases) application."
            echo
            echo "This GitHub release does not automatically publish the mod to the FAF Mod Vault."
            echo
            echo "## Changes"
            echo
            cat generated-changelog.md
          } > release-notes.md
      - name: Create draft mod release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "FAF-Caster-Bridge-${TAG}.zip" --draft --verify-tag --title "FAF Caster Bridge $TAG" --notes-file release-notes.md
